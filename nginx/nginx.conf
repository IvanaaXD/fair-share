# Nginx as the single entry point: serves the React web app and forwards API calls to the
# API container. The browser sees one origin (http://localhost), so in this setup CORS is
# not even needed - it stays configured for local development (Vite on port 5173).

server {
    listen 80;
    server_name _;

    # Receipt photos and profile images are uploaded through the API.
    client_max_body_size 10m;

    # Basic hardening headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # ---------- API ----------
    # No trailing slash after the address: the path is forwarded unchanged (/api/groups -> /api/groups).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # The API reads these through UseForwardedHeaders (ReverseProxy:Enabled = true), so per-IP
        # rate limits and logs see the real client address instead of Nginx's.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Needed later for SignalR (real-time notifications use WebSockets).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # Swagger UI and the OpenAPI document (available only when the API runs in Development).
    location ~ ^/(swagger|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- React web app (single-page application) ----------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Client-side routes (e.g. /groups/123) do not exist as files - return index.html and
        # let React Router handle them.
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS files have a content hash in their names, so they can be cached for long.
    location /assets/ {
        expires 30d;
        # A location with its own add_header does not inherit the server-level ones, so repeat it.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
}
