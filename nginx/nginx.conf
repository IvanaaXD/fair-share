# Nginx as the single entry point: serves the React web app and forwards API calls to the
# API container. The browser sees one origin (https://localhost), so in this setup CORS is
# not even needed - it stays configured for local development (Vite on port 5173).

# WebSocket upgrade for SignalR (real-time notifications, /api/hubs/notifications).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- HTTP: only redirects to HTTPS ----------
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Self-signed certificate for localhost, created by the "certs" service in docker-compose.yml.
    # On a real server this would be a certificate from a certificate authority (e.g. Let's Encrypt).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Receipt photos and profile images are uploaded through the API.
    client_max_body_size 10m;

    # Basic hardening headers. HSTS is left out on purpose: for "localhost" it would also force
    # HTTPS on the Vite development server (http://localhost:5173). On a real domain it belongs here.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # ---------- API ----------
    # No trailing slash after the address: the path is forwarded unchanged (/api/groups -> /api/groups).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # The API reads these through UseForwardedHeaders (ReverseProxy:Enabled = true), so per-IP
        # rate limits and logs see the real client address, and the API knows the request was HTTPS.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR keeps a WebSocket open; without these it falls back to slower long polling.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # Swagger UI and the OpenAPI document (available only when the API runs in Development).
    location ~ ^/(swagger|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- React web app (single-page application) ----------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Client-side routes (e.g. /groups/123) do not exist as files - return index.html and
        # let React Router handle them.
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS files have a content hash in their names, so they can be cached for long.
    location /assets/ {
        expires 30d;
        # A location with its own add_header does not inherit the server-level ones, so repeat it.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
}
